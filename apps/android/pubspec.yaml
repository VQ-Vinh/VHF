name: prana_mobile
description: PRANA ELEX station control and live translation for Android and iOS.
publish_to: none
version: 1.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.0.0
  dio: ^5.11.1
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.3.1
  flutter_tts: ^4.2.5
  go_router: ^18.0.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.5
  record: ^7.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo_mark.png
    - assets/logo_lockup.png
    # OFL 1.1 requires the licence to travel with the fonts it covers.
    - assets/fonts/RobotoMono-OFL.txt
    - assets/fonts/Archivo-OFL.txt
  # Live VHF console faces, bundled so the console reads the same offshore
  # with no network. Pinned upstream: googlefonts/RobotoMono@895ec691 and
  # Omnibus-Type/Archivo@21112769.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
