name: prana_mobile
description: PRANA ELEX station control and live translation for Android.
publish_to: none
version: 1.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.9.0
  dio: ^5.10.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_tts: ^4.2.5
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.5
  record: ^7.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_mark.png
    - assets/logo_lockup.png
