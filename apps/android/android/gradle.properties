org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
android.enableJetifier=true
# Pub cache is on C: while this project is on D:. Kotlin incremental caches
# cannot relativize sources across drive roots on Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Flutter stable 3.44.x still requires the temporary legacy KGP compatibility.
# Migrate this to true once Flutter stable 3.47+ is available.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
