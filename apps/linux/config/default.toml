[general]
session_prefix = "session"
data_dir = "."
log_level = "INFO"
num_workers = 4

[audio]
capture_mode = "device"
sample_rate = 48000
channels = 1
dtype = "int16"
frame_size = 2048
device_index = -1

[vad]
backend = "silero"
min_speech_duration_ms = 300
min_silence_duration_ms = 1500
max_segment_duration_ms = 15000
threshold = 0.3
energy_threshold = 300
silero_model_path = ""

[backend]
api_url = "https://prana-api-owuilj5d4a-uc.a.run.app"
# The station signs every request with its Ed25519 key and never signs a
# user in, so it reads neither of the two values below. They stay only for
# schema parity with the Windows build.
firebase_api_key = ""
google_oauth_client_id = "515336425252-aqkkoc9j9pmji0bsedg7g8hid398ee21.apps.googleusercontent.com"
timeout_seconds = 150

[translation]
enabled = true
source_language = "auto"
target_language = "en"

[ptt]
enabled = true
gpio_pin = 17
active_high = true

[storage]
retention_days = 14
cleanup_interval_hours = 24

[storage.local]
audio_dir = "./VHF_Storage/audio"
result_dir = "./VHF_Storage/results"
