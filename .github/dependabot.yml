version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /services/prana_api
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/prana_admin
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      # One PR per week resolves pubspec.lock once. Separate PRs each rewrote
      # pubspec.yaml without a lock that satisfies it, so every one of them
      # failed `flutter pub get --enforce-lockfile`. Majors stay ungrouped:
      # they can need code or Gradle changes and must be reviewed on their own.
      flutter-minor-patch:
        update-types: [minor, patch]
    ignore:
      # flutter_localizations from the Flutter SDK pins intl exactly, so any
      # bump past that pin fails version solving and can never be merged.
      # Drop this entry once the pinned SDK ships a newer intl.
      - dependency-name: intl
  - package-ecosystem: docker
    directory: /services/prana_api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/prana_admin
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
