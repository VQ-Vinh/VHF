name: Terraform staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-staging
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-infra-plan
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Restore protected staging variables
        shell: bash
        env:
          TFVARS_STAGING_B64: ${{ secrets.TFVARS_STAGING_B64 }}
        run: |
          set -euo pipefail
          test -n "$TFVARS_STAGING_B64"
          printf '%s' "$TFVARS_STAGING_B64" | base64 --decode > ci.auto.tfvars
          chmod 600 ci.auto.tfvars
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=5m -out=staging.tfplan
      - name: Summarize actions without exposing values
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json staging.tfplan > "$RUNNER_TEMP/plan.json"
          add="$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$RUNNER_TEMP/plan.json")"
          change="$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' "$RUNNER_TEMP/plan.json")"
          destroy="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$RUNNER_TEMP/plan.json")"
          {
            echo '### Terraform staging plan'
            echo "- Create: $add"
            echo "- Update: $change"
            echo "- Delete/replace: $destroy"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt the saved plan
        shell: bash
        env:
          TFPLAN_ENCRYPTION_KEY: ${{ secrets.TFPLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test "${#TFPLAN_ENCRYPTION_KEY}" -ge 32
          key_file="$RUNNER_TEMP/tfplan.key"
          printf '%s' "$TFPLAN_ENCRYPTION_KEY" > "$key_file"
          chmod 600 "$key_file"
          gpg --batch --yes --pinentry-mode loopback --cipher-algo AES256 \
            --passphrase-file "$key_file" --symmetric \
            --output staging.tfplan.gpg staging.tfplan
          test -s staging.tfplan.gpg
      - name: Remove plaintext Terraform material
        if: always()
        run: rm -f ci.auto.tfvars staging.tfplan "$RUNNER_TEMP/tfplan.key" "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-staging-${{ github.sha }}
          path: infra/terraform/staging.tfplan.gpg
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply approved plan
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-infra
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
      - run: terraform init -input=false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-staging-${{ github.sha }}
          path: infra/terraform
      - name: Decrypt the approved plan
        shell: bash
        env:
          TFPLAN_ENCRYPTION_KEY: ${{ secrets.TFPLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test "${#TFPLAN_ENCRYPTION_KEY}" -ge 32
          test -s staging.tfplan.gpg
          key_file="$RUNNER_TEMP/tfplan.key"
          printf '%s' "$TFPLAN_ENCRYPTION_KEY" > "$key_file"
          chmod 600 "$key_file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$key_file" --decrypt \
            --output staging.tfplan staging.tfplan.gpg
          test -s staging.tfplan
      - name: Apply the exact approved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve staging.tfplan
      - name: Remove decrypted Terraform material
        if: always()
        run: rm -f staging.tfplan staging.tfplan.gpg "$RUNNER_TEMP/tfplan.key"
