name: Deploy production

on:
  workflow_dispatch:
    inputs:
      service:
        description: Immutable staging service image to promote
        required: true
        type: choice
        options: [prana-api, prana-admin]
      digest:
        description: Staging image digest (sha256:...)
        required: true
        type: string
      source_sha:
        description: Main commit SHA that built and deployed the staging image
        required: true
        type: string

permissions:
  checks: read
  contents: read
  id-token: write

concurrency:
  group: deploy-production-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote approved digest
    if: vars.PRODUCTION_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate immutable digest
        shell: bash
        env:
          DIGEST: ${{ inputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          checks="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100")"
          jq -e 'any(.check_runs[]; .name == "gate" and .conclusion == "success")' \
            <<<"$checks" >/dev/null
      - id: staging-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_RELEASE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_STAGING_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.staging-auth.outputs.access_token }}
      - name: Verify the commit tag, digest and staging revision
        shell: bash
        env:
          SOURCE: ${{ vars.GCP_STAGING_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_STAGING_ARTIFACT_REPOSITORY }}/${{ inputs.service }}@${{ inputs.digest }}
          SOURCE_TAG: ${{ vars.GCP_STAGING_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_STAGING_ARTIFACT_REPOSITORY }}/${{ inputs.service }}:${{ inputs.source_sha }}
          DIGEST: ${{ inputs.digest }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE_TAG"
          tagged_digest="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$SOURCE_TAG" \
            | grep -F "${SOURCE_TAG%:*}@" | head -1 | sed 's/.*@//')"
          [[ "$tagged_digest" == "$DIGEST" ]]
          docker pull "$SOURCE"
          revisions="$(gcloud run revisions list \
            --project "${{ vars.GCP_STAGING_PROJECT_ID }}" \
            --region "${{ vars.GCP_STAGING_REGION }}" \
            --service "$SERVICE" --format=json)"
          jq -e --arg digest "$DIGEST" \
            'any(.[]; .status.imageDigest == $digest)' <<<"$revisions" >/dev/null
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy-staging.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$SOURCE" >/dev/null
      - id: production-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PRODUCTION_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_PRODUCTION_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.production-auth.outputs.access_token }}
      - id: promote
        shell: bash
        env:
          SOURCE: ${{ vars.GCP_STAGING_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_STAGING_ARTIFACT_REPOSITORY }}/${{ inputs.service }}@${{ inputs.digest }}
          TARGET_ROOT: ${{ vars.GCP_PRODUCTION_REGION }}-docker.pkg.dev/${{ vars.GCP_PRODUCTION_PROJECT_ID }}/${{ vars.GCP_PRODUCTION_ARTIFACT_REPOSITORY }}/${{ inputs.service }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          tag="promoted-${DIGEST#sha256:}"
          target="$TARGET_ROOT:${tag:0:21}"
          docker tag "$SOURCE" "$target"
          docker push "$target"
          promoted_digest="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$target" \
            | grep -F "$TARGET_ROOT@" | head -1 | sed 's/.*@//')"
          [[ "$promoted_digest" == "$DIGEST" ]]
          echo "image=$TARGET_ROOT@$promoted_digest" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/deploy-cloud-run
        with:
          service: ${{ inputs.service }}
          image: ${{ steps.promote.outputs.image }}
          project_id: ${{ vars.GCP_PRODUCTION_PROJECT_ID }}
          region: ${{ vars.GCP_PRODUCTION_REGION }}
          require_health: ${{ inputs.service == 'prana-api' && 'true' || 'false' }}
