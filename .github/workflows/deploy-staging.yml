name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  changes:
    if: >-
      vars.STAGING_CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api: ${{ steps.paths.outputs.api }}
      admin: ${{ steps.paths.outputs.admin }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-selection
          path: selection
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: paths
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          selection=selection/deploy-selection.json
          test -s "$selection"
          sha="$(jq -er '.head_sha' "$selection")"
          [[ "$sha" == "$EXPECTED_SHA" ]]
          api="$(jq -er '.deploy_api | if type == "boolean" then tostring else error("deploy_api must be boolean") end' "$selection")"
          admin="$(jq -er '.deploy_admin | if type == "boolean" then tostring else error("deploy_admin must be boolean") end' "$selection")"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo '### Staging path selection'
            echo "- CI run: ${{ github.event.workflow_run.id }}"
            echo "- Commit: \`$sha\`"
            echo "- API: $api"
            echo "- Admin: $admin"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: commit
        env:
          SHA: ${{ steps.paths.outputs.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/prana_api/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/prana-api:${{ needs.changes.outputs.sha }}
          build-args: |
            VCS_REF=${{ needs.changes.outputs.sha }}
            BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=prana-api
          cache-to: type=gha,mode=max,scope=prana-api
          provenance: mode=max
          sbom: true
      - name: Sign API image by digest
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/prana-api@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: ./.github/actions/deploy-cloud-run
        with:
          service: prana-api
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/prana-api@${{ steps.build.outputs.digest }}
          project_id: ${{ vars.GCP_STAGING_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          require_health: 'true'

  deploy-admin:
    name: Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging-admin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/prana_admin/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/prana-admin:${{ needs.changes.outputs.sha }}
          build-args: |
            VCS_REF=${{ needs.changes.outputs.sha }}
            BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_RUN_ID=${{ github.run_id }}
          cache-from: type=gha,scope=prana-admin
          cache-to: type=gha,mode=max,scope=prana-admin
          provenance: mode=max
          sbom: true
      - name: Sign Admin image by digest
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/prana-admin@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: ./.github/actions/deploy-cloud-run
        with:
          service: prana-admin
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_STAGING_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/prana-admin@${{ steps.build.outputs.digest }}
          project_id: ${{ vars.GCP_STAGING_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          require_health: 'false'
