name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.select.outputs.base_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      all_tracked_fallback: ${{ steps.select.outputs.all_tracked_fallback }}
      backend: ${{ steps.select.outputs.backend }}
      core_linux: ${{ steps.select.outputs.core_linux }}
      windows: ${{ steps.select.outputs.windows }}
      android: ${{ steps.select.outputs.android }}
      terraform: ${{ steps.select.outputs.terraform }}
      deploy_api: ${{ steps.select.outputs.deploy_api }}
      deploy_admin: ${{ steps.select.outputs.deploy_admin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci/changed_components.py
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --event "${{ github.event_name }}"
          --github-output "$GITHUB_OUTPUT"
          --json-output deploy-selection.json
      - name: Summarize selection
        env:
          SELECTION: ${{ toJSON(steps.select.outputs) }}
        run: |
          {
            echo '### CI component selection'
            echo '```json'
            echo "$SELECTION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload staging selection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-selection
          path: deploy-selection.json
          retention-days: 1
          if-no-files-found: error

  quality:
    name: Quality, conventions and secrets
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check changed range for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          FALLBACK: ${{ needs.changes.outputs.all_tracked_fallback }}
        run: |
          set -euo pipefail
          if [[ "$FALLBACK" == "true" ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Install convention test dependency
        run: python -m pip install pytest
      - name: Run repository convention tests
        run: python -m pytest tests/conventions
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  backend:
    name: API and Admin tests (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            services/prana_api/requirements.txt
            services/prana_admin/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/prana_api/requirements.txt
          python -m pip install -r services/prana_admin/requirements.txt
          python -m pip install pytest
      - name: Run API and Admin tests
        run: python -m pytest tests/api tests/admin
      - name: Run Firestore TX transaction contract
        if: matrix.python == '3.11'
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --only firestore --project prana-ci
          "python -m pytest tests/api/test_tx_firestore_contract.py"

  core-linux:
    name: Core, Linux and packaging tests
    needs: changes
    if: needs.changes.outputs.core_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/prana_core/pyproject.toml
            apps/linux/pyproject.toml
      - name: Install native audio dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 180 apt-get install --yes --no-install-recommends \
                libsndfile1 portaudio19-dev; then
              exit 0
            fi
            echo "apt attempt $attempt did not finish; retrying" >&2
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - name: Install Station test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e packages/prana_core
          python -m pip install --no-build-isolation --no-deps -e apps/linux
          python -m pip install keyring pyaudio pytest
      - name: Run core, Linux and packaging tests
        run: python -m pytest tests/core tests/linux tests/packaging

  windows:
    name: Windows tests
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/prana_core/pyproject.toml
            apps/windows/pyproject.toml
      - name: Install Windows test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/prana_core
          python -m pip install --no-build-isolation --no-deps -e apps/windows
          python -m pip install pytest
      - name: Run Windows tests
        run: python -m pytest tests/windows

  android:
    name: Flutter analyze and tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  terraform:
    name: Terraform validation
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  containers:
    name: Container build and smoke tests
    needs: changes
    if: needs.changes.outputs.deploy_api == 'true' || needs.changes.outputs.deploy_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke-test selected services
        shell: bash
        env:
          BUILD_API: ${{ needs.changes.outputs.deploy_api }}
          BUILD_ADMIN: ${{ needs.changes.outputs.deploy_admin }}
        run: |
          set -Eeuo pipefail
          containers=()
          cleanup() {
            for container in "${containers[@]}"; do
              docker logs "$container" 2>/dev/null || true
              docker rm --force "$container" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          smoke() {
            local name="$1" image="$2" port="$3"
            docker run --detach --name "$name" --publish "$port:8080" "$image"
            containers+=("$name")
            for attempt in {1..30}; do
              if response="$(curl --fail --silent --show-error "http://127.0.0.1:$port/health" 2>/dev/null)"; then
                python -c 'import json,sys; assert json.loads(sys.argv[1]) == {"status":"ok"}' "$response"
                return
              fi
              sleep 1
            done
            echo "$name did not become healthy" >&2
            return 1
          }

          if [[ "$BUILD_API" == "true" ]]; then
            docker build --file services/prana_api/Dockerfile --tag prana-api-ci .
            smoke prana-api-ci prana-api-ci 18080
          fi
          if [[ "$BUILD_ADMIN" == "true" ]]; then
            docker build --file services/prana_admin/Dockerfile --tag prana-admin-ci .
            smoke prana-admin-ci prana-admin-ci 18081
          fi
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - id: scan-api
        name: Scan API image for fixable critical vulnerabilities
        if: always() && needs.changes.outputs.deploy_api == 'true'
        continue-on-error: true
        run: >-
          trivy image --scanners vuln --format sarif --output trivy-api-policy.sarif
          --severity CRITICAL --ignore-unfixed --exit-code 1 prana-api-ci
      - name: Report all API critical vulnerabilities
        if: always() && needs.changes.outputs.deploy_api == 'true'
        run: >-
          trivy image --scanners vuln --format sarif --output trivy-api.sarif
          --severity CRITICAL --exit-code 0 prana-api-ci
      - name: Create API SBOM
        if: always() && needs.changes.outputs.deploy_api == 'true'
        run: trivy image --format cyclonedx --output sbom-api.cdx.json prana-api-ci
      - id: scan-admin
        name: Scan Admin image for fixable critical vulnerabilities
        if: always() && needs.changes.outputs.deploy_admin == 'true'
        continue-on-error: true
        run: >-
          trivy image --scanners vuln --format sarif --output trivy-admin-policy.sarif
          --severity CRITICAL --ignore-unfixed --exit-code 1 prana-admin-ci
      - name: Report all Admin critical vulnerabilities
        if: always() && needs.changes.outputs.deploy_admin == 'true'
        run: >-
          trivy image --scanners vuln --format sarif --output trivy-admin.sarif
          --severity CRITICAL --exit-code 0 prana-admin-ci
      - name: Create Admin SBOM
        if: always() && needs.changes.outputs.deploy_admin == 'true'
        run: trivy image --format cyclonedx --output sbom-admin.cdx.json prana-admin-ci
      - name: Upload vulnerability reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-${{ github.sha }}
          path: |
            trivy-*.sarif
            sbom-*.cdx.json
          retention-days: 14
          if-no-files-found: error
      - name: Enforce vulnerability policy
        if: always()
        env:
          API_SCAN: ${{ steps.scan-api.outcome }}
          ADMIN_SCAN: ${{ steps.scan-admin.outcome }}
        run: |
          [[ "$API_SCAN" != failure ]]
          [[ "$ADMIN_SCAN" != failure ]]

  gate:
    name: gate
    if: always()
    needs: [changes, quality, backend, core-linux, windows, android, terraform, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mandatory jobs and all selected jobs to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          BACKEND: ${{ needs.backend.result }}
          CORE_LINUX: ${{ needs.core-linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          ANDROID: ${{ needs.android.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: |
          test "$CHANGES" = success
          test "$QUALITY" = success
          for result in "$BACKEND" "$CORE_LINUX" "$WINDOWS" "$ANDROID" "$TERRAFORM" "$CONTAINERS"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
