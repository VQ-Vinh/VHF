name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  backend:
    name: API and Admin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/prana_api/requirements.txt
            services/prana_admin/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/prana_api/requirements.txt
          python -m pip install -r services/prana_admin/requirements.txt
          python -m pip install pytest
      - name: Run API and Admin tests
        run: python -m pytest tests/api tests/admin
      - name: Run Firestore TX transaction contract
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --only firestore --project prana-ci
          "python -m pytest tests/api/test_tx_firestore_contract.py"

  core-linux:
    name: Core, Linux and packaging tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/prana_core/pyproject.toml
            apps/linux/pyproject.toml
      - name: Install native audio dependencies
        # The apt mirror stalls often enough to hang this job for hours, so cap
        # each attempt and retry instead of waiting on a socket that never closes.
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get -o Acquire::Retries=3 update               && sudo timeout 180 apt-get install --yes --no-install-recommends                 libsndfile1 portaudio19-dev; then
              exit 0
            fi
            echo "apt attempt $attempt did not finish; retrying" >&2
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - name: Install Station test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e packages/prana_core
          python -m pip install --no-build-isolation --no-deps -e apps/linux
          python -m pip install keyring pyaudio pytest
      - name: Run core, Linux, packaging and convention tests
        run: python -m pytest tests/core tests/linux tests/packaging tests/conventions

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/prana_core/pyproject.toml
            apps/windows/pyproject.toml
      - name: Install Windows test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/prana_core
          python -m pip install --no-build-isolation --no-deps -e apps/windows
          python -m pip install pytest
      - name: Run Windows tests
        run: python -m pytest tests/windows

  android:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  gate:
    name: gate
    if: always()
    needs: [quality, backend, core-linux, windows, android, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          BACKEND: ${{ needs.backend.result }}
          CORE_LINUX: ${{ needs.core-linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          ANDROID: ${{ needs.android.result }}
          TERRAFORM: ${{ needs.terraform.result }}
        run: |
          for result in "$QUALITY" "$BACKEND" "$CORE_LINUX" "$WINDOWS" "$ANDROID" "$TERRAFORM"; do
            test "$result" = success
          done
