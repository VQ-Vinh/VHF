name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  backend:
    name: API and Admin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/prana_api/requirements.txt
            services/prana_admin/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/prana_api/requirements.txt
          python -m pip install -r services/prana_admin/requirements.txt
          python -m pip install pytest
      - name: Run API and Admin tests
        run: python -m pytest tests/api tests/admin

  core-linux:
    name: Core, Linux and packaging tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/prana_core/pyproject.toml
            apps/linux/pyproject.toml
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsndfile1 portaudio19-dev
      - name: Install Station test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e packages/prana_core
          python -m pip install --no-build-isolation --no-deps -e apps/linux
          python -m pip install keyring pyaudio pytest
      - name: Run core, Linux and packaging tests
        run: python -m pytest tests/core tests/linux tests/packaging tests/client

  windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/prana_core/pyproject.toml
            apps/windows/pyproject.toml
      - name: Install Windows test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e packages/prana_core
          python -m pip install --no-build-isolation -e apps/windows
          python -m pip install pytest
      - name: Run Windows tests
        run: python -m pytest tests/windows

  android:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.8.5'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  gate:
    name: gate
    if: always()
    needs: [quality, backend, core-linux, windows, android, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          BACKEND: ${{ needs.backend.result }}
          CORE_LINUX: ${{ needs.core-linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          ANDROID: ${{ needs.android.result }}
          TERRAFORM: ${{ needs.terraform.result }}
        run: |
          for result in "$QUALITY" "$BACKEND" "$CORE_LINUX" "$WINDOWS" "$ANDROID" "$TERRAFORM"; do
            test "$result" = success
          done
